About=Martin Luther (1483–1546) was a German theologian, Augustinian friar, and the central figure of the Protestant Reformation. His biblical commentaries, drawn from his lectures at the University of Wittenberg, are foundational documents of Protestant theology. This collection includes Luther's expositions on selected passages of Scripture, reflecting his passionate commitment to the authority of the Bible and the doctrine of justification by faith alone.  \par\par Prepared by SermonIndex.net from https://www.sermonindex.net/commentary/luthercmt/
