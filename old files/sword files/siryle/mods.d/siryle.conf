About=John Charles Ryle (1816–1900) was the first Bishop of Liverpool and one of the greatest evangelical leaders in the Church of England during the Victorian era. His Expository Thoughts on the Gospels, covering Matthew, Mark, Luke, and John, is widely considered one of the finest devotional commentaries on the Gospels ever written. Ryle's clear, forceful prose and his ability to draw practical spiritual lessons from every passage have made this work a beloved classic for over 150 years.  \par\par Prepared by SermonIndex.net from https://www.sermonindex.net/commentary/ryle-expository-thoughts/
