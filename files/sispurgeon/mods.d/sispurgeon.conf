About=Charles Haddon Spurgeon (1834–1892) was an English Particular Baptist preacher known as the 'Prince of Preachers,' who drew thousands to the Metropolitan Tabernacle in London every week. His biblical expositions, drawn from his sermons, lectures, and writings — including The Treasury of David on the Psalms — represent some of the richest devotional commentary in the English language. Spurgeon combined deep Reformed theology with passionate evangelistic fervor and remarkable literary gifts.  \par\par Prepared by SermonIndex.net from https://www.sermonindex.net/commentary/spurgeon/
