Description=Barnes' Notes on the Bible
About=Albert Barnes (1798–1870) was an American Presbyterian minister and theologian who served as pastor of the First Presbyterian Church in Philadelphia for nearly four decades. His Notes on the Bible, covering the entire Old and New Testaments, became one of the most widely used commentaries in American churches. Written for the ordinary reader, Barnes' notes are clear, practical, and theologically conservative, offering solid exposition without requiring knowledge of the original languages.  \par\par Prepared by SermonIndex.net from https://www.sermonindex.net/commentary/barnes/
